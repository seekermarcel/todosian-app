name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.TODOSIAN_RELEASE_KEYSTORE_BASE64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check signing secrets
        id: secrets
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets set; skipping the signed release build."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        if: steps.secrets.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build signed release APK
        if: steps.secrets.outputs.present == 'true'
        env:
          TODOSIAN_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          TODOSIAN_RELEASE_STORE_PASSWORD: ${{ secrets.TODOSIAN_RELEASE_STORE_PASSWORD }}
          TODOSIAN_RELEASE_KEY_ALIAS: ${{ secrets.TODOSIAN_RELEASE_KEY_ALIAS }}
          TODOSIAN_RELEASE_KEY_PASSWORD: ${{ secrets.TODOSIAN_RELEASE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$TODOSIAN_RELEASE_STORE_FILE"
          chmod +x gradlew
          ./gradlew :app:assembleRelease --console=plain

      - name: Verify APK signature
        if: steps.secrets.outputs.present == 'true'
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | grep -q "SHA-256 digest: 17bcf9ab86986be85ac05fad03fc8f001500e1026461a3d84827a9378682b1ec" \
            || { echo "::error::APK is unsigned or signed with an unexpected key"; exit 1; }

      - name: Publish GitHub release
        if: steps.secrets.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          apk="todosian-fork-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber
          else
            gh release create "$TAG" "$apk" --title "$TAG" --generate-notes
          fi
